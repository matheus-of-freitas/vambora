# Cloudflare Pages config for vambora-web (Next.js via @cloudflare/next-on-pages).
# Pages reads this from the project Root directory (`web/`). nodejs_compat is
# required for Next SSR on the Edge runtime. See docs/operations/domain-deferred.md.
name = "vambora-web"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
